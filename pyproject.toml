[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trial-matcher"
version = "0.1.0"
description = "Clinical Trial Eligibility Matching Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Clinical Trial Matcher"}
]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "streamlit>=1.30",
    "pandas>=2.1",
    "plotly>=5.18",
    "httpx>=0.26",
    "rapidfuzz>=3.5",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "ollama>=0.1",
    "instructor>=0.5",
    "openai>=1.10",
    "medspacy>=1.0",
    "negspacy>=1.0",
    "scispacy>=0.5",
    "faker>=22.0",
    "dateparser>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "psycopg2-binary>=2.9",
    "duckdb>=0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trial_matcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
